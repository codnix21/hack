services:
  db:
    image: postgres:16-alpine
    container_name: bas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot}
      POSTGRES_DB: ${POSTGRES_DB:-robot_platform}
    # Не публикуем наружу по умолчанию — только docker-сеть.
    # Для отладки: POSTGRES_PORT=127.0.0.1:5435
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-robot} -d ${POSTGRES_DB:-robot_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bas-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-robot}:${POSTGRES_PASSWORD:-robot}@db:5432/${POSTGRES_DB:-robot_platform}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-robot-platform-secret-key-2024}
      # Домен продакшена + локальная отладка
      CORS_ORIGINS: ${CORS_ORIGINS:-https://bas.netcorehub.ru,https://www.bas.netcorehub.ru,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
    volumes:
      - ./data:/data
    # Снаружи не нужен: API идёт через frontend nginx (/api).
    # Для отладки: BACKEND_PORT=127.0.0.1:8010
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8010}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Относительный URL — браузер ходит на тот же домен /api
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: bas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host nginx (FastPanel) → этот порт. 8899 занят myadminservers, 8901 — m5stack.
      - "${FRONTEND_PORT:-127.0.0.1:8910}:80"

volumes:
  pgdata:
